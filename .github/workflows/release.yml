# Every push to main that passes the checks is released and the Storybook deployed.
#
# Versioning (see README § Versioning — this workflow is what enforces it):
#   · package.json's version has no tag yet → that version is released as-is
#     (set it by hand for any release you want to number yourself).
#   · otherwise the bump is decided since the last tag:
#       anything REMOVED from the public surface (scripts/api_surface.py: exports, ui-*
#         classes, CSS variables, token keys, custom elements, entry points) is breaking,
#         whether or not the commit says so;
#       so is a commit marked "refactor!: …" or with a "BREAKING CHANGE:" line —
#         bumps MINOR while below 1.0.0, MAJOR from 1.0.0 on;
#       from 1.0.0 on, a "feat: …" subject bumps MINOR;
#       anything else bumps PATCH.
#   · each release gets a tag vX.Y.Z and a GitHub Release with generated notes.
#   · the Storybook is rebuilt showing that version and published to GitHub Pages.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Design checks
        run: python3 dev_check.py
      - name: Generated files are current
        run: python3 build_css.py --check && python3 shadcn/build_shadcn.py --check
      - name: Types
        run: npx tsc -p .

      - name: Decide the version
        id: version
        run: |
          if tag=$(git describe --tags --exact-match HEAD 2>/dev/null); then
            echo "HEAD is already $tag; nothing to release"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"; echo "new=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          current=$(node -p "require('./package.json').version")
          if ! git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
            version=$current; reason="package.json set by hand"
            # A hand-set version may not be smaller than what a removal requires.
            last=$(git describe --tags --abbrev=0)
            removed=$(python3 scripts/api_surface.py --removed "$last")
            if [ -n "$removed" ]; then
              IFS=. read -r lM lm _ <<< "${last#v}"; IFS=. read -r nM nm _ <<< "$version"
              if { [ "$lM" = 0 ] && [ "$nM" = 0 ] && [ "$nm" = "$lm" ]; } || { [ "$lM" != 0 ] && [ "$nM" = "$lM" ]; }; then
                echo "::error::v$version removes public API since $last but is not a breaking bump:"; echo "$removed"
                echo "Set package.json to the next minor (below 1.0) or major version, or restore what was removed."; exit 1
              fi
              { echo "### Removed from the public API since $last"; echo '```'; echo "$removed"; echo '```'; } > removed.md
            fi
          else
            last=$(git describe --tags --abbrev=0)
            log=$(git log "$last"..HEAD --format='%s%n%b')
            major=${current%%.*}
            # Anything removed from the public surface (exports, ui-* classes, CSS variables,
            # token keys, custom elements, package entry points) is breaking, marked or not.
            removed=$(python3 scripts/api_surface.py --removed "$last")
            if [ -n "$removed" ]; then
              level=$([ "$major" = 0 ] && echo minor || echo major); reason="public API removed since $last"
              { echo "### Removed from the public API since $last"; echo '```'; echo "$removed"; echo '```'; } > removed.md
            elif echo "$log" | grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE:'; then
              level=$([ "$major" = 0 ] && echo minor || echo major); reason="breaking change marked since $last"
            elif [ "$major" != 0 ] && echo "$log" | grep -qE '^feat(\([^)]*\))?:'; then
              level=minor; reason="feature since $last"
            else
              level=patch; reason="no breaking change since $last"
            fi
            version=$(npm version "$level" --no-git-tag-version | sed 's/^v//')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"; echo "new=true" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version ($reason)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the Storybook
        run: npx storybook build --quiet

      - name: Tag and publish the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet package.json; then git commit -qam "Release v$V"; fi
          git tag "v$V"
          git push origin HEAD:main "v$V"
          if [ -f removed.md ]; then
            gh release create "v$V" --title "v$V" --generate-notes --verify-tag --notes-file removed.md
          else
            gh release create "v$V" --title "v$V" --generate-notes --verify-tag
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  storybook:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
